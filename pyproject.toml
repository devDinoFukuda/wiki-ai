[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "wiki-ai"
version = "2.0.0a0"
requires-python = ">=3.12"
dependencies = []

[project.scripts]
wiki-ai = "wiki_ai.app.commands:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q -p no:cacheprovider"
