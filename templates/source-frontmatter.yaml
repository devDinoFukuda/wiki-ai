---
# Cabeçalho de proveniência — copie no topo de TODA fonte (inbox/ e raw/).
# Sem este bloco, o arquivo não é fonte: o lint (L2) manda para quarentena.
# O bloco deve começar com --- na PRIMEIRA linha (comentários ficam dentro).
id:                              # identificador estável, ex.: sb-2026-0142
source_type:                     # human-transcript | human-doc | code-repo | agent-output | web-clip
origin: ""                       # fonte concreta. Ex.: "sessão transferência — Maria (arquiteta), 2026-07-10"
                                 # ou "repo acme/api @a1b2c3d". NUNCA inventar.
captured_at:                     # ISO 8601, ex.: 2026-07-10T14:30:00Z
promoted: false                  # true só depois de passar pelo portão (promote)
promoted_by:                     # humano ou regra que promoveu
promoted_at:
confidence: raw                  # raw | reviewed | canonical
supersedes:                      # id da fonte que este substitui, se houver
source_link:                     # link p/ gravação, commit ou doc original
---
